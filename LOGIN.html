
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090510">
  <title>VOID WALKER | Enter the Void</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap');

    :root {
      --void: #090510;
      --purple: #9b30ff;
      --bright: #d9a0ff;
      --white: #f7edff;
      --muted: #b9acc9;
      --glass: rgba(16, 8, 29, 0.88);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(ellipse at 15% 20%, #53128a 0%, transparent 38%),
        radial-gradient(ellipse at 85% 80%, #301064 0%, transparent 38%),
        linear-gradient(135deg, #05030b, #160728 55%, #08030e);
      position: relative;
    }

    /* Animated cosmic background */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -50%;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background-image:
        radial-gradient(2px 2px at 15% 25%, white 99%, transparent),
        radial-gradient(2px 2px at 75% 30%, #d8a0ff 99%, transparent),
        radial-gradient(1px 1px at 45% 70%, white 99%, transparent),
        radial-gradient(2px 2px at 85% 85%, #a74cff 99%, transparent),
        radial-gradient(1px 1px at 25% 90%, white 99%, transparent);
      background-size: 260px 260px;
      animation: stars 35s linear infinite;
    }

    body::after {
      inset: auto;
      width: 380px;
      height: 380px;
      top: -180px;
      right: -120px;
      border-radius: 50%;
      background: #8c25ff;
      filter: blur(130px);
      opacity: 0.22;
    }

    @keyframes stars {
      to { transform: translateY(260px); }
    }

    .page {
      width: 100%;
      max-width: 490px;
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-symbol {
      font-size: 42px;
      color: var(--bright);
      text-shadow: 0 0 25px var(--purple);
      animation: pulse 3s ease-in-out infinite;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(28px, 6vw, 43px);
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 10px #a43dff, 0 0 30px #7e19ff;
    }

    .brand p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 4px;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.12);
        text-shadow: 0 0 40px #b85cff;
      }
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px;
      border: 1px solid rgba(187, 103, 255, 0.65);
      border-radius: 22px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 25px rgba(142, 38, 255, 0.18),
        0 0 70px rgba(92, 24, 156, 0.14),
        inset 0 0 25px rgba(135, 45, 220, 0.06);
    }

    .card::before {
      content: "";
      position: absolute;
      height: 2px;
      top: 0;
      left: 15%;
      right: 15%;
      background: linear-gradient(90deg, transparent, #d5a0ff, transparent);
      box-shadow: 0 0 20px #ad51ff;
    }

    .switcher {
      display: flex;
      padding: 5px;
      gap: 5px;
      margin-bottom: 27px;
      border-radius: 12px;
      background: #08040e;
      border: 1px solid #342047;
    }

    .switcher button {
      flex: 1;
      padding: 12px 8px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: 0.3s;
    }

    .switcher button.active {
      color: white;
      background: linear-gradient(110deg, #7414e7, #a63dff);
      box-shadow: 0 0 20px rgba(155, 48, 255, 0.35);
    }

    .heading {
      margin-bottom: 23px;
    }

    .heading h2 {
      font-size: 25px;
      font-weight: 600;
    }

    .heading p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: #e1c6ff;
    }

    .field input {
      width: 100%;
      padding: 14px 15px;
      outline: none;
      border: 1px solid #49315f;
      border-radius: 10px;
      color: white;
      background: rgba(5, 3, 12, 0.8);
      font: inherit;
      font-size: 14px;
      transition: 0.25s;
    }

    .field input::placeholder {
      color: #80728e;
    }

    .field input:focus {
      border-color: #c27aff;
      box-shadow: 0 0 0 3px rgba(155, 48, 255, 0.14),
                  0 0 16px rgba(155, 48, 255, 0.12);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 3px 0 23px;
      font-size: 12px;
      color: var(--muted);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      accent-color: var(--purple);
    }

    .text-button {
      padding: 0;
      border: 0;
      background: none;
      color: var(--bright);
      font: inherit;
      cursor: pointer;
    }

    .text-button:hover {
      color: white;
      text-decoration: underline;
    }

    .main-button {
      width: 100%;
      padding: 15px;
      border: 1px solid #c47aff;
      border-radius: 10px;
      color: white;
      background: linear-gradient(110deg, #7615e9, #a12eff, #6911c7);
      box-shadow: 0 0 22px rgba(155, 48, 255, 0.27);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    .main-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(181, 93, 255, 0.5);
    }

    .main-button:active {
      transform: scale(0.98);
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb5c0;
      border: 1px solid #85334e;
      background: rgba(130, 25, 55, 0.18);
    }

    .message.info {
      color: #e1c6ff;
      border: 1px solid #68408a;
      background: rgba(100, 30, 150, 0.18);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #9986aa;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #382348;
    }

    .account-prompt {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .account-prompt button {
      margin-left: 4px;
      font-weight: 600;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #a68bbd;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      .card { padding: 22px 18px; }
      .brand p { letter-spacing: 2px; }
      .heading h2 { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="brand">
      <div class="brand-symbol" aria-hidden="true">✧</div>
      <h1>VOID WALKER</h1>
      <p>THE JOURNEY NEVER ENDS</p>
    </header>

    <section class="card" aria-label="Void Walker account">

      <div class="switcher" role="group" aria-label="Choose account action">
        <button type="button" id="loginTab" class="active"
          aria-pressed="true">Login</button>
        <button type="button" id="registerTab"
          aria-pressed="false">Register</button>
      </div>

      <div class="heading">
        <h2 id="formTitle">Welcome Back, Walker</h2>
        <p id="formDescription">
          Return to the world of Harris and Harlina.
        </p>
      </div>

      <form id="authForm" novalidate>

        <div class="field hidden" id="usernameField">
          <label for="username">Username</label>
          <input id="username" name="username" type="text"
            placeholder="Choose your Walker name"
            autocomplete="username" minlength="3" maxlength="24">
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email"
            placeholder="Enter your email"
            autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            minlength="8" required>
        </div>

        <div class="field hidden" id="confirmField">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword"
            type="password" placeholder="Enter your password again"
            autocomplete="new-password" minlength="8">
        </div>

        <div class="options" id="loginOptions">
          <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
          </label>
          <button type="button" class="text-button" id="forgotButton">
            Forgot password?
          </button>
        </div>

        <button class="main-button" type="submit" id="submitButton">
          ENTER THE VOID
        </button>

        <p class="message" id="message" role="status"
          aria-live="polite"></p>
      </form>

      <div class="divider">YOUR JOURNEY STARTS HERE</div>

      <p class="account-prompt">
        <span id="promptText">New to the Void?</span>
        <button type="button" class="text-button" id="switchLink">
          Create account
        </button>
      </p>
    </section>

    <footer class="footer">
      ✧ VOID WALKER · READ · EXPLORE · BELONG ✧
    </footer>
  </main>

 
<script>
const authForm = document.getElementById("authForm");
const message = document.getElementById("message");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const switchLink = document.getElementById("switchLink");

const formTitle = document.getElementById("formTitle");
const formDescription = document.getElementById("formDescription");
const usernameField = document.getElementById("usernameField");
const confirmField = document.getElementById("confirmField");
const loginOptions = document.getElementById("loginOptions");
const promptText = document.getElementById("promptText");
const submitButton = document.getElementById("submitButton");

const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");

let isRegisterMode = false;
let isSubmitting = false;

function showMessage(text, type = "info") {
    message.textContent = text;
    message.className = "message show " + type;
}

function clearMessage() {
    message.textContent = "";
    message.className = "message";
}

function setMode(registerMode) {
    isRegisterMode = registerMode;
    clearMessage();
    authForm.reset();

    usernameField.classList.toggle("hidden", !registerMode);
    confirmField.classList.toggle("hidden", !registerMode);
    loginOptions.classList.toggle("hidden", registerMode);

    usernameInput.required = registerMode;
    confirmInput.required = registerMode;

    passwordInput.autocomplete = registerMode
        ? "new-password"
        : "current-password";

    loginTab.classList.toggle("active", !registerMode);
    registerTab.classList.toggle("active", registerMode);

    loginTab.setAttribute("aria-pressed", String(!registerMode));
    registerTab.setAttribute("aria-pressed", String(registerMode));

    formTitle.textContent = registerMode
        ? "Join the Void Walker Universe"
        : "Welcome Back, Walker";

    formDescription.textContent = registerMode
        ? "Create your account and begin your journey."
        : "Return to the world of Harris and Harlina.";

    submitButton.textContent = registerMode
        ? "CREATE ACCOUNT"
        : "ENTER THE VOID";

    promptText.textContent = registerMode
        ? "Already a Walker?"
        : "New to the Void?";

    switchLink.textContent = registerMode
        ? "Login"
        : "Create account";
}

loginTab.addEventListener("click", () => setMode(false));
registerTab.addEventListener("click", () => setMode(true));

switchLink.addEventListener("click", () => {
    setMode(!isRegisterMode);
});

document.getElementById("forgotButton").addEventListener("click", () => {
    showMessage(
        "Password recovery is not available yet. Please remember your password.",
        "info"
    );
});

authForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (isSubmitting) return;

    clearMessage();

    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (isRegisterMode && username.length < 3) {
        showMessage("Username must have at least 3 characters.", "error");
        return;
    }

    if (isRegisterMode && username.length > 30) {
        showMessage("Username cannot exceed 30 characters.", "error");
        return;
    }

    if (!emailInput.validity.valid || !email) {
        showMessage("Please enter a valid email address.", "error");
        return;
    }

    if (password.length < 8) {
        showMessage("Password must have at least 8 characters.", "error");
        return;
    }

    if (isRegisterMode && password !== confirmInput.value) {
        showMessage("Your passwords do not match.", "error");
        return;
    }

    const endpoint = isRegisterMode
        ? "http://localhost:5000/api/auth/register"
        : "http://localhost:5000/api/auth/login";

    const requestBody = isRegisterMode
        ? { username, email, password }
        : { email, password };

    isSubmitting = true;
    submitButton.disabled = true;
    submitButton.textContent = isRegisterMode
        ? "CREATING ACCOUNT..."
        : "ENTERING THE VOID...";

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Request failed.");
        }

        if (isRegisterMode) {
            showMessage(
                "Account created successfully! You can now log in.",
                "info"
            );

            setMode(false);
            emailInput.value = email;

        } else {
            if (!data.token || !data.user) {
                throw new Error("The server returned an incomplete login response.");
            }

            sessionStorage.setItem("voidWalkerToken", data.token);
            sessionStorage.setItem(
                "voidWalkerUser",
                JSON.stringify(data.user)
            );

            showMessage(
                "Welcome to the Void, " + data.user.username + "!",
                "info"
            );

            window.location.href = "index.html";
        }

    } catch (error) {
        console.error("Authentication error:", error);

        if (error.message === "Failed to fetch") {
            showMessage(
                "Cannot connect to the backend. Check that the server is running on port 5000.",
                "error"
            );
        } else {
            showMessage(error.message, "error");
        }

    } finally {
        isSubmitting = false;
        submitButton.disabled = false;
        submitButton.textContent = isRegisterMode
            ? "CREATE ACCOUNT"
            : "ENTER THE VOID";
    }
});
</script>

</body>
</html>
